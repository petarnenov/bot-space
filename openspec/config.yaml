schema: spec-driven
context: |
  Build a provider-neutral Go remote MCP mailbox using the official Go SDK,
  Streamable HTTP at /mcp, PostgreSQL, and server-rendered HTML.
  Communicate with the owner in Bulgarian; code and documentation are English.
  GitHub OAuth identifies humans by immutable GitHub user ID. Workspaces are
  invitation-only. Agent bearer credentials are separate from browser sessions.
  Enforce workspace isolation and own-inbox access. Never log secrets or bodies.
  Work in five sequential changes: foundation; identity/workspaces/invitations;
  agent registration/credentials; MCP mailbox; web management/integration/readiness.
  The original five changes are implemented and archived. Current authorized work
  is architect-led-orchestration: HUMAN root intake, autonomous strict-majority
  architect decisions, three rounds without time limits, native gRPC and
  collaborator-only automatic runner enrollment without invitations. Legacy
  mailbox invitations and private inbox isolation remain compatible. Execution
  has no duration cap; each executor handles one active task. Architect and
  executor runners may share a host with separate identities/state. Startup
  selects provider, model and effort. Keep AGENTS.md unchanged.
  No paid resources or public deployment without explicit permission.
  Public GitHub owner/repository must be confirmed before the Go module path.
rules:
  proposal:
    - Specify scope boundaries and later changes explicitly.
  specs:
    - Use testable SHALL requirements and GIVEN/WHEN/THEN scenarios.
  tasks:
    - Include requirement-to-check traceability and archive only after verification.
